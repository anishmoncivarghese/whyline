# whyline-relay configuration. Every key is optional.
plan = "plans/personal-assistant.plan.md"
max_rounds = 24
timeout_minutes = 60
branch_prefix = "relay/"

[agents.codex]
command = ["codex", "exec", "-s", "workspace-write", "--add-dir", "/Users/anish/whyline-relay", "--add-dir", "/Users/anish/.cache/uv", "--color", "never"]
model = "gpt-5.6-sol"

[agents.claude]
command = ["claude", "-p", "--permission-mode", "acceptEdits", "--output-format", "json", "--settings", ".whyline/relay/claude-settings.json"]
model = "sonnet"

[agents.antigravity]
adapter = "generic"
command = ["agy", "--output-format", "json", "--model", "gemini-4-argon-medium", "--mode", "accept-edits", "--add-dir", ".", "--new-project", "-p"]

[agents.grok]
adapter = "generic"
command = ["grok", "--output-format", "json", "--permission-mode", "dontAsk", "--deny", "Bash(git push:*)", "--deny", "Bash(rm -rf:*)", "--allow", "Edit", "--allow", "Bash(git add:*)", "--allow", "Bash(git commit:*)", "--allow", "Bash(git diff:*)", "--allow", "Bash(git status:*)", "--allow", "Bash(git log:*)", "--allow", "Bash(whyline:*)", "--allow", "Bash(python3:*)", "--allow", "Bash(uv run:*)", "--allow", "Bash(uv:*)", "--allow", "Bash(mkdir:*)", "--allow", "Bash(ls:*)", "--allow", "Bash(find:*)", "--allow", "Bash(touch:*)", "--allow", "Bash(cat:*)", "--allow", "Bash(grep:*)", "--allow", "Bash(head:*)", "--allow", "Bash(tail:*)", "--allow", "Bash(wc:*)", "--allow", "Bash(diff:*)", "--allow", "Bash(pwd:*)", "--allow", "Bash(git show:*)", "--allow", "Bash(git rev-parse:*)", "--allow", "Bash(git -C /Users/anish/whyline-relay status:*)", "--allow", "Bash(git -C /Users/anish/whyline-relay diff:*)", "--allow", "Bash(git -C /Users/anish/whyline-relay log:*)", "--allow", "Bash(git -C /Users/anish/whyline-relay show:*)", "--allow", "Bash(pytest:*)", "--allow", "Bash(.venv/bin/pytest:*)", "--allow", "Bash(.venv/bin/python:*)", "--allow", "WebFetch", "--rules", "Headless run: nobody can approve a prompt, and any shell command outside your allow list ends your whole turn. Run one plain command per shell call. Never use shell control flow (if, for, while, case), subshells, $(...), backticks, background &, or bash -c. Chain only with && or |, each part an allowed command. Prefer your read, search and edit tools to shell commands.", "--model", "grok-4.6", "-p"]

[roles]
implementer = "claude"
tester      = "codex"
reviewer    = "codex"
release = "human"

[pipeline]
default_profile = "full"

[pipeline.profiles]
full = ["draft", "test", "review"]

[pipeline.stages.draft]
role   = "implementer"
prompt = "implement"
max_visits = 6
[pipeline.stages.draft.on]
ready = "@next"

[pipeline.stages.test]
role       = "tester"
prompt     = "test"
max_visits = 6
[pipeline.stages.test.on]
passed = "@next"
failed = "draft"

[pipeline.stages.review]
role   = "reviewer"
prompt = "review"
max_visits = 6
[pipeline.stages.review.on]
approved = "@complete"
rejected = "draft"

[planner]
draft = "grok"
review = "codex"
test = ""

[backup]
chain = ["codex"]
