name: release

# Publishes to PyPI via Trusted Publishing (OIDC). No API token exists anywhere:
# PyPI verifies this workflow's identity directly, so there is no long-lived
# credential to leak, rotate, or accidentally scope too widely.
#
# Requires a Trusted Publisher registered on PyPI for this repository, with
# workflow `release.yml` and environment `pypi`.
#
# To release: tag a commit on main and push the tag.
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

jobs:
  ci-passed:
    # Never publish something the suite has not passed on the exact tagged tree.
    # ci.yml runs the full matrix (Windows included) on every push, and the
    # Release button waits for it before tagging, so this job checks that result
    # instead of running the same hour of tests a second time on the same commit.
    # A tag pushed by hand waits here for ci on its commit, and fails without it.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for a passing ci run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          RUNS="repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50"
          for _ in $(seq 1 150); do
            PASSED=$(gh api "$RUNS" --jq '[.workflow_runs[]|select(.conclusion=="success")]|length')
            if [ "$PASSED" -gt 0 ]; then
              echo "ci passed on $SHA"
              exit 0
            fi
            LIVE=$(gh api "$RUNS" --jq '[.workflow_runs[]|select(.status!="completed")]|length')
            if [ "$LIVE" -eq 0 ]; then
              echo "::error::no passing ci run for $SHA; rerun ci, then rerun this workflow"
              exit 1
            fi
            echo "waiting for ci on $SHA ($LIVE running)"
            sleep 60
          done
          echo "::error::ci on $SHA did not finish within 150 minutes"
          exit 1

  publish:
    needs: ci-passed
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mints the short-lived OIDC token PyPI checks. This is the whole mechanism.
      id-token: write
      # Lets the final step create the GitHub Release. Without it `gh release
      # create` 403s, and the default GITHUB_TOKEN is read-only on contents.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Refuse to publish if the tag disagrees with pyproject
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(uv run python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - run: uv build

      - name: Refuse to publish local paths or internal notes
        # The sdist is built from the working tree, not from git, so a gitignored
        # file can still be swept in. That nearly happened on 2026-08-18:
        # .claude/settings.local.json (home-directory paths, locally approved shell
        # commands) and 27 files of internal review workspace were in the default
        # sdist. A PyPI upload cannot be withdrawn, so this gate is the last line.
        run: |
          set -u
          # Strip the leading `whyline-<version>/` component so patterns can be
          # anchored to the archive root. Testing a captured string for emptiness
          # rather than chaining greps: `grep -qv` returns 0 on empty input under
          # BSD grep, so the obvious pipeline fired on every archive, clean or
          # not — a gate that always fails teaches people to bypass it.
          ENTRIES=$(tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||')
          FOUND=0
          for prefix in '.claude' '.superpowers' '.whyline' 'm0' 'docs'; do
            HITS=$(printf '%s\n' "$ENTRIES" | grep "^${prefix}/" || true)
            if [ -n "$HITS" ]; then
              echo "::error::sdist contains ${prefix}/ — $(printf '%s' "$HITS" | wc -l) entries"
              FOUND=1
            fi
          done
          PATHS=$(tar -xzOf dist/*.tar.gz | grep -o '/Users/[A-Za-z0-9._-]*' || true)
          if [ -n "$PATHS" ]; then
            echo "::error::sdist contains absolute home paths"
            FOUND=1
          fi
          if [ "$FOUND" != "0" ]; then
            echo "::error::refusing to publish; a PyPI upload cannot be withdrawn"
            exit 1
          fi
          echo "sdist is clean: $(printf '%s\n' "$ENTRIES" | grep -c . ) entries"

      - name: Verify the wheel installs and runs standalone
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          /tmp/verify/bin/whyline --version
          test -x /tmp/verify/bin/whyline-hook

      - name: Verify each extra installs from the built wheel
        # Installing from source (uv sync) can't catch a file left out of
        # the packaged wheel by mistake -- this installs straight from
        # dist/*.whl with each extra, into its own clean venv, and imports
        # the module that extra is supposed to make available, proving the
        # extra's own code -- not just its dependency declaration -- is
        # actually inside the built package.
        run: |
          WHEEL=$(ls dist/*.whl)
          verify_extra() {
            extra="$1"; check="$2"
            uv venv "/tmp/verify-$extra"
            uv pip install --python "/tmp/verify-$extra/bin/python" "${WHEEL}[$extra]"
            "/tmp/verify-$extra/bin/python" -c "$check"
            echo "$extra: ok"
          }
          verify_extra console "from whyline.console import editor; assert editor.AVAILABLE"
          verify_extra ui "from whyline.console import tui; assert tui.TUI_AVAILABLE"
          verify_extra relay "import whyline_relay"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      # Pushing a tag creates a tag, not a Release — they are different objects,
      # which is why v0.1.0 through v0.1.2 shipped with their rationale recorded
      # nowhere a user could read it. For a tool whose entire purpose is
      # preserving *why*, that was the wrong default.
      #
      # Runs after publishing on purpose: a Release pointing at a version PyPI
      # rejected would be a lie, and a failed publish is the more useful error.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # whyline's Release button creates the Release right after it pushes the
          # tag, long before this job gets here. Attach the files to that one
          # instead of failing on "already exists" after PyPI has the upload.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --clobber
            exit 0
          fi
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file "$NOTES" \
              dist/*.whl dist/*.tar.gz
          else
            # No hand-written notes: generate from commits rather than ship an
            # empty Release, and say so, so the omission is visible not silent.
            echo "::warning::no $NOTES; generating notes from commit history"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --generate-notes \
              dist/*.whl dist/*.tar.gz
          fi
